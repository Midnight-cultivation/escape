<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>脱出ゲーム</title>
<style>
  body{
    margin: 0;
    background: #222;
    font-family: sans-serif;
  }

  /* ---------- 部屋の表示エリア ---------- */
  #view{
    position: relative;
    height: 70vh;
  }
  #view img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* 左右に置く回転用のクリック領域 */
  .side{
    position: absolute;
    top: 0;
    width: 18%;
    height: 100%;
  }
  .side.left{ left: 0; }
  .side.right{ right: 0; }

  /* オブジェクトの当たり判定(仮の枠線。完成時は消してOK) */
  .hit{
    position: absolute;
    border: 2px dashed rgba(255,255,255,.3);
    cursor: pointer;
  }

  /* ---------- 所持品欄 ---------- */
  #inventory{
    background: #111;
    color: #fff;
    padding: 10px;
    min-height: 1.5em;
  }
  #inventory .item{
    display: inline-block;
    margin-right: 8px;
    padding: 2px 8px;
    background: #333;
    border-radius: 4px;
  }

  /* ---------- モーダル(調べた時の詳細表示) ---------- */
  #modal{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
  }
  #modal-panel{
    background: #fff;
    width: 320px;
    margin: 10vh auto;
    padding: 16px;
    border-radius: 6px;
  }
</style>
</head>
<body>

  <div id="view">
    <img id="room-image" alt="部屋の画像">
    <div id="rotate-left"  class="side left"></div>
    <div id="rotate-right" class="side right"></div>
    <div id="hit-areas"></div>
  </div>

  <div id="inventory">所持品:<span id="inventory-list"></span></div>

  <div id="modal">
    <div id="modal-panel"></div>
  </div>

<script>
/* =========================================================
   1. データ定義
   ここに部屋・オブジェクトを追加していく
   ========================================================= */

// 部屋を向く方向の並び(左右クリックでこの順に回る)
const DIRECTIONS = ["north", "east", "south", "west"];

// 各方向の部屋データ
//   img  : 表示する画像URL      → あとで実際の写真に差し替える
//   objs : クリックできるオブジェクトの当たり判定
//     x, y, w, h : 画面に対する%位置・サイズ
//     id         : actions側と対応させるための識別子
const ROOMS = {
  north: {
    img: "images/north.jpg",
    objs: [
      // 押し入れ上段のふすま4枚
      { id: "fusuma_kita_1", x: 9.2,  y: 19.8, w: 9.4, h: 10.8 },
      { id: "fusuma_kita_2", x: 18.6, y: 19.8, w: 9.4, h: 10.8 },
      { id: "fusuma_kita_3", x: 28.0, y: 19.8, w: 9.4, h: 10.8 },
      { id: "fusuma_kita_4", x: 37.4, y: 19.8, w: 9.4, h: 10.8 },
    ],
  },
  east: {
    img: "images/east.jpg",
    objs: [
      { id: "drawer", x: 65, y: 20, w: 25, h: 55 },
    ],
  },
  south: {
    img: "images/south.jpg",
    objs: [
      { id: "fuji_painting", x: 34.9, y: 26.4, w: 10.4, h: 13.3 },
      { id: "tansu",         x: 65.3, y: 40.9, w: 24.0, h: 22.8 },
      { id: "zabuton_left",   x: 2.8,  y: 70.9, w: 20.4, h: 15.6 },
      { id: "zabuton_center", x: 32.1, y: 76.9, w: 20.0, h: 15.6 },
      { id: "zabuton_right",  x: 59.3, y: 70.9, w: 18.0, h: 15.6 },
    ],
  },
  west: {
    img: "images/west.jpg",
    objs: [
      { id: "fusuma_nishi", x: 34.9, y: 18.0, w: 30.0, h: 55.3 },
      { id: "kakejiku",     x: 15.6, y: 18.6, w: 6.4,  h: 41.5 },
      { id: "kinko",        x: 71.3, y: 57.1, w: 18.0, h: 18.6 },
    ],
  },
};

// オブジェクトごとの処理(id をキーに、クリック時の動作を書く)
// ここに1個ずつ実装を追加していけばよい形にしてある
const ACTIONS = {
  drawer: {
    title: "引き出し",
    onExamine() {
      showModal("引き出し", "<p>ここを画像や処理に差し替える</p>");
    },
  },

  // ---- north: 押し入れのふすま4枚 ----
  fusuma_kita_1: {
    title: "ふすま(左端)",
    onExamine() { showModal("ふすま(左端)", "<p>ここを画像や処理に差し替える</p>"); },
  },
  fusuma_kita_2: {
    title: "ふすま(左)",
    onExamine() { showModal("ふすま(左)", "<p>ここを画像や処理に差し替える</p>"); },
  },
  fusuma_kita_3: {
    title: "ふすま(右)",
    onExamine() { showModal("ふすま(右)", "<p>ここを画像や処理に差し替える</p>"); },
  },
  fusuma_kita_4: {
    title: "ふすま(右端)",
    onExamine() { showModal("ふすま(右端)", "<p>ここを画像や処理に差し替える</p>"); },
  },

  // ---- south: 座布団3枚・富士山の絵・箪笥 ----
  fuji_painting: {
    title: "富士山の絵",
    onExamine() { showModal("富士山の絵", "<p>ここを画像や処理に差し替える</p>"); },
  },
  tansu: {
    title: "箪笥",
    onExamine() { showModal("箪笥", "<p>ここを画像や処理に差し替える</p>"); },
  },
  zabuton_left: {
    title: "座布団(左)",
    onExamine() { showModal("座布団(左)", "<p>ここを画像や処理に差し替える</p>"); },
  },
  zabuton_center: {
    title: "座布団(中央)",
    onExamine() { showModal("座布団(中央)", "<p>ここを画像や処理に差し替える</p>"); },
  },
  zabuton_right: {
    title: "座布団(右)",
    onExamine() { showModal("座布団(右)", "<p>ここを画像や処理に差し替える</p>"); },
  },

  // ---- west: ふすま・掛け軸・金庫 ----
  fusuma_nishi: {
    title: "ふすま",
    onExamine() { showModal("ふすま", "<p>ここを画像や処理に差し替える</p>"); },
  },
  kakejiku: {
    title: "掛け軸",
    onExamine() { showModal("掛け軸", "<p>ここを画像や処理に差し替える</p>"); },
  },
  kinko: {
    title: "金庫",
    onExamine() { showModal("金庫", "<p>ここを画像や処理に差し替える</p>"); },
  },
};

/* =========================================================
   2. 状態管理
   ========================================================= */
const state = {
  dirIndex: 0,       // 現在向いている方向(DIRECTIONSのindex)
  inventory: [],      // 所持品(アイテムidの配列)
};

/* =========================================================
   3. DOM要素の取得
   ========================================================= */
const el = {
  roomImage:     document.getElementById("room-image"),
  hitAreas:      document.getElementById("hit-areas"),
  rotateLeft:    document.getElementById("rotate-left"),
  rotateRight:   document.getElementById("rotate-right"),
  inventoryList: document.getElementById("inventory-list"),
  modal:         document.getElementById("modal"),
  modalPanel:    document.getElementById("modal-panel"),
};

/* =========================================================
   4. 描画処理
   ========================================================= */

// 現在の方向の部屋を描画する
function renderRoom() {
  const room = ROOMS[DIRECTIONS[state.dirIndex]];

  el.roomImage.src = room.img;
  el.hitAreas.innerHTML = "";

  room.objs.forEach(obj => {
    const hitEl = document.createElement("div");
    hitEl.className = "hit";
    hitEl.style.left   = obj.x + "%";
    hitEl.style.top    = obj.y + "%";
    hitEl.style.width  = obj.w + "%";
    hitEl.style.height = obj.h + "%";
    hitEl.onclick = () => examineObject(obj.id);
    el.hitAreas.appendChild(hitEl);
  });
}

// 所持品欄を再描画する
function renderInventory() {
  el.inventoryList.innerHTML = state.inventory
    .map(itemId => `<span class="item">${itemId}</span>`)
    .join("");
}

/* =========================================================
   5. オブジェクト操作
   ========================================================= */

// オブジェクトをクリックした時に呼ばれる
function examineObject(id) {
  const action = ACTIONS[id];
  if (!action) {
    console.warn("未定義のオブジェクト:", id);
    return;
  }
  action.onExamine();
}

// 所持品にアイテムを追加する(今後、謎解き処理から呼び出す用)
function addItem(itemId) {
  if (!state.inventory.includes(itemId)) {
    state.inventory.push(itemId);
    renderInventory();
  }
}

/* =========================================================
   6. モーダル操作
   ========================================================= */

function showModal(title, bodyHtml) {
  el.modalPanel.innerHTML = `
    <h3>${title}</h3>
    ${bodyHtml}
    <button onclick="closeModal()">戻る</button>
  `;
  el.modal.style.display = "block";
}

function closeModal() {
  el.modal.style.display = "none";
}

/* =========================================================
   7. 方向の回転
   ========================================================= */

function rotate(step) {
  state.dirIndex = (state.dirIndex + step + DIRECTIONS.length) % DIRECTIONS.length;
  renderRoom();
}

el.rotateLeft.onclick  = () => rotate(-1);
el.rotateRight.onclick = () => rotate(1);

/* =========================================================
   8. 初期描画
   ========================================================= */
renderRoom();
renderInventory();
</script>
</body>
</html>
