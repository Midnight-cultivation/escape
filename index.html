<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#222;font-family:sans-serif}#view{position:relative;height:70vh}img{width:100%;height:100%;object-fit:cover}.side{position:absolute;top:0;width:18%;height:100%}.L{left:0}.R{right:0}.hit{position:absolute;border:2px dashed rgba(255,255,255,.3)}#inv{background:#111;color:#fff;padding:10px}#modal{display:none;position:fixed;inset:0;background:#0008}#panel{background:#fff;width:320px;margin:10vh auto;padding:10px}</style><body><div id=view><img id=img><div id=l class="side L"></div><div id=r class="side R"></div><div id=objs></div></div><div id=inv>所持品:</div><div id=modal><div id=panel></div></div><script>
const dirs=["north","east","south","west"];let dir=0;
const rooms={north:{img:"https://placehold.co/800x600?text=North",objs:[{x:10,y:20,w:25,h:60,a:"door"}]},east:{img:"https://placehold.co/800x600?text=East",objs:[{x:65,y:20,w:25,h:55,a:"drawer"}]},south:{img:"https://placehold.co/800x600?text=South",objs:[]},west:{img:"https://placehold.co/800x600?text=West",objs:[{x:35,y:15,w:25,h:30,a:"painting"}]}};
function draw(){let rm=rooms[dirs[dir]];img.src=rm.img;objs.innerHTML="";rm.objs.forEach(o=>{let d=document.createElement("div");d.className="hit";d.style.left=o.x+"%";d.style.top=o.y+"%";d.style.width=o.w+"%";d.style.height=o.h+"%";d.onclick=()=>{modal.style.display="block";panel.innerHTML="<h3>"+o.a+"</h3><p>ここを画像や処理に差し替える</p><button onclick=modal.style.display='none'>戻る</button>"};objs.appendChild(d);});}
l.onclick=()=>{dir=(dir+3)%4;draw()};r.onclick=()=>{dir=(dir+1)%4;draw()};draw();
</script>
